<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AVTOHABR изнутри</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;700&display=swap">
<style>
:root { --bg: #060A15; --panel: #111A2E; --ink: #E8EEFA; --muted: #93A1BF; --line: rgba(255,255,255,0.12); --accent: #6FA8F5; --bad: #F07996; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: radial-gradient(900px 500px at 20% 10%, rgba(74,143,232,0.22), transparent 60%), radial-gradient(800px 500px at 90% 90%, rgba(165,139,255,0.16), transparent 60%), var(--bg);
  color: var(--ink); font: 500 15px 'Manrope', 'Segoe UI', system-ui, sans-serif; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
form { width: min(400px, 100%); background: rgba(17,26,46,0.85); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; display: grid; gap: 14px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,0.45) }
.brand { font: 700 12px 'Unbounded', sans-serif; letter-spacing: 0.16em; background: linear-gradient(90deg, #6FA8F5, #A58BFF); -webkit-background-clip: text; background-clip: text; color: transparent }
h1 { margin: 0; font: 700 22px/1.2 'Unbounded', sans-serif }
p { margin: 0; color: var(--muted) }
input { width: 100%; font: 600 16px 'Manrope', sans-serif; color: var(--ink); background: #0B1224; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none }
input:focus { border-color: var(--accent) }
button { font: 700 15px 'Manrope', sans-serif; color: #fff; background: linear-gradient(90deg, #4A8FE8, #7A5CF0); border: 0; border-radius: 12px; padding: 12px; cursor: pointer }
button:disabled { opacity: .6; cursor: wait }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.err { color: var(--bad); min-height: 1.2em; font-size: 14px }
label.keep { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px }
label.keep input { width: auto }
</style>
</head>
<body>

  <div class="brand">AVTOHABR</div>
  <h1>Закрытая карта проекта</h1>
  <p>Введите пароль, который дал владелец.</p>
  <label for="pw" style="position:absolute;left:-9999px">Пароль</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required autofocus>
  <label class="keep" for="keep"><input id="keep" type="checkbox"> Не спрашивать до закрытия вкладки</label>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err" role="alert"></div>
</form>

const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(SALT), iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(DATA)));
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Открываю…';
  const pw = document.getElementById('pw').value; const keep = document.getElementById('keep').checked;
  try { await open(pw); try { if (keep) sessionStorage.setItem('mm-k', pw) } catch (x) {} }
  catch (x) { err.textContent = 'Пароль не подходит.'; go.disabled = false; go.textContent = 'Открыть' }
});
try { const k = sessionStorage.getItem('mm-k'); if (k) open(k).catch(() => sessionStorage.removeItem('mm-k')) } catch (x) {}
})();
